<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suno Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13; color: #e0e0e0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 16px;
      padding: 40px; width: 100%; max-width: 580px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo { font-size: 26px; font-weight: 700; margin-bottom: 6px; background: linear-gradient(135deg, #9b59b6, #6c3fc8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 28px; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; margin-top: 16px; }
    .input-row { display: flex; gap: 10px; }
    input[type="text"], input[type="password"] {
      flex: 1; background: #0f0f13; border: 1px solid #2a2a3a; border-radius: 10px;
      padding: 11px 14px; color: #e0e0e0; font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #6c3fc8; }
    input::placeholder { color: #444; }
    button {
      background: linear-gradient(135deg, #9b59b6, #6c3fc8); color: white; border: none;
      border-radius: 10px; padding: 11px 18px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .token-note { font-size: 11px; color: #555; margin-top: 6px; }
    .divider { text-align: center; color: #444; font-size: 12px; margin: 22px 0; position: relative; }
    .divider::before, .divider::after { content:''; position:absolute; top:50%; width:44%; height:1px; background:#2a2a3a; }
    .divider::before { left:0; } .divider::after { right:0; }
    textarea {
      width: 100%; background: #0f0f13; border: 1px solid #2a2a3a; border-radius: 10px;
      padding: 11px 14px; color: #e0e0e0; font-size: 12px; outline: none; resize: vertical;
      min-height: 90px; font-family: monospace; transition: border-color 0.2s;
    }
    textarea:focus { border-color: #6c3fc8; }
    .btn-full { width: 100%; margin-top: 10px; }
    .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .error { color: #e74c3c; } .success { color: #2ecc71; } .info { color: #3498db; }
    .queue { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .q-item {
      background: #0f0f13; border: 1px solid #2a2a3a; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 10px;
    }
    .q-name { flex: 1; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-dl { padding: 5px 12px; font-size: 12px; border-radius: 6px; flex-shrink: 0; }
    .q-state { font-size: 12px; color: #888; flex-shrink: 0; }
    .q-state.done { color: #2ecc71; } .q-state.loading { color: #f39c12; } .q-state.err { color: #e74c3c; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎵 Suno DL</div>
  <div class="subtitle">Download Suno songs (m4a) named after the song title</div>

  <div class="divider">Single download</div>

  <label>Suno URL or Song ID</label>
  <div class="input-row">
    <input type="text" id="urlInput" placeholder="https://suno.com/song/b1b5163c-..." />
    <button onclick="downloadSingle()">⬇ Download</button>
  </div>
  <div class="status" id="status"></div>

  <div class="divider">Batch download</div>

  <label>Multiple URLs (one per line)</label>
  <textarea id="batchInput" placeholder="https://suno.com/song/xxx&#10;https://suno.com/song/yyy"></textarea>
  <button class="btn-full" onclick="addBatch()">Add to Queue & Download All</button>
  <div class="queue" id="queue"></div>
</div>

<script>
  // Suno only sends Access-Control-Allow-Origin for https://suno.com and
  // http://localhost:<any port>. So on localhost we call the API directly, and
  // anywhere else we go through /suno-api/*, which vercel.json rewrites to Suno
  // server-side - that request is same-origin, so CORS never enters the picture.
  const ON_LOCALHOST = location.hostname === 'localhost' && location.protocol === 'http:';
  const CLIP_API = ON_LOCALHOST
    ? 'https://studio-api-prod.suno.com/api/clip/'
    : '/suno-api/clip/';

  function extractId(input) {
    const match = input.trim().match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    return match ? match[0] : null;
  }

  function sanitizeFilename(name) {
    return name.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim().slice(0, 150) || 'suno-song';
  }

  function setStatus(msg, type = 'info') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  // A blocked request surfaces as a bare TypeError with no status to report, so
  // name the specific setup mistake instead of echoing "Failed to fetch".
  function explain(e) {
    if (!(e instanceof TypeError)) return e.message;

    if (location.protocol === 'file:') {
      return 'Opening this file directly does not work. Run `npx serve` and open http://localhost:PORT';
    }
    if (location.hostname === '127.0.0.1') {
      return 'Use http://localhost:PORT, not 127.0.0.1 - Suno allows the localhost hostname only';
    }
    if (ON_LOCALHOST) {
      return 'Could not reach the Suno API (offline, or Suno is down)';
    }
    return `Could not reach ${CLIP_API} - this deployment needs the /suno-api rewrite from vercel.json`;
  }

  // Picking the download URL is the whole trick, because two of the three the API
  // hands back are dead ends:
  //   audio_url      -> literally "https://studio-api.prod.suno.com/api/forbidden"
  //   media_urls[]   -> 200 OK but ENCRYPTED (no ftyp box, random bytes, unplayable)
  //   video_url      -> plain AAC in an MP4 container, and audio-only (1 track, no
  //                     video stream), so it is an m4a in all but file extension.
  // cdn1.suno.ai/<id>.mp3, which this app used to guess, is now 403 MissingKey.
  async function fetchClip(id) {
    const res = await fetch(CLIP_API + id);
    if (!res.ok) throw new Error(`API HTTP ${res.status}`);
    const data = await res.json();

    if (!data.video_url) throw new Error('No downloadable audio for this song');

    const title = (data.title || '').trim() || `suno-${id}`;
    return { url: data.video_url, filename: `${sanitizeFilename(title)}.m4a`, title };
  }

  async function triggerDownload(url, filename) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Download HTTP ${res.status}`);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  async function downloadSingle() {
    const id = extractId(document.getElementById('urlInput').value);
    if (!id) { setStatus('Invalid URL or ID', 'error'); return; }

    setStatus('Fetching song info...', 'info');
    try {
      const clip = await fetchClip(id);
      setStatus(`Downloading ${clip.filename}...`, 'info');
      await triggerDownload(clip.url, clip.filename);
      setStatus(`✓ Downloaded: ${clip.filename}`, 'success');
    } catch (e) {
      setStatus(`Error: ${explain(e)}`, 'error');
    }
  }

  function addBatch() {
    const lines = document.getElementById('batchInput').value.split('\n').filter(l => l.trim());
    const queue = document.getElementById('queue');
    const newIds = [];
    lines.forEach(line => {
      const id = extractId(line);
      if (!id || document.getElementById('qi-' + id)) return;
      const item = document.createElement('div');
      item.className = 'q-item'; item.id = 'qi-' + id;
      item.innerHTML = `
        <div class="q-name" id="qn-${id}">${id}</div>
        <span class="q-state" id="qs-${id}">waiting</span>
        <button class="q-dl" onclick="downloadQueueItem('${id}')">⬇</button>
      `;
      queue.appendChild(item);
      newIds.push(id);
    });
    if (newIds.length) downloadAllQueue(newIds);
  }

  async function downloadQueueItem(id) {
    const stateEl = document.getElementById('qs-' + id);
    const nameEl = document.getElementById('qn-' + id);
    stateEl.className = 'q-state loading';
    try {
      stateEl.textContent = 'fetching...';
      const clip = await fetchClip(id);
      nameEl.textContent = clip.filename;
      nameEl.title = clip.title;

      stateEl.textContent = 'downloading...';
      await triggerDownload(clip.url, clip.filename);
      stateEl.textContent = '✓ done'; stateEl.className = 'q-state done';
    } catch (e) {
      stateEl.textContent = '✗ error'; stateEl.className = 'q-state err';
      stateEl.title = explain(e);
    }
  }

  async function downloadAllQueue(ids) {
    for (const id of ids) {
      await downloadQueueItem(id);
      await new Promise(r => setTimeout(r, 600));
    }
  }
</script>
</body>
</html>
