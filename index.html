<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suno Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #9b59b6, #6c3fc8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; }
    .input-row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #6c3fc8; }
    input[type="text"]::placeholder { color: #444; }
    button {
      background: linear-gradient(135deg, #9b59b6, #6c3fc8);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .batch-area {
      margin-top: 24px;
      border-top: 1px solid #2a2a3a;
      padding-top: 24px;
    }
    textarea {
      width: 100%;
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      resize: vertical;
      min-height: 100px;
      font-family: monospace;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #6c3fc8; }
    .btn-batch {
      margin-top: 10px;
      width: 100%;
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      min-height: 20px;
    }
    .status.error { color: #e74c3c; }
    .status.success { color: #2ecc71; }
    .status.info { color: #3498db; }
    .queue {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .queue-item {
      background: #0f0f13;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .queue-item .name { flex: 1; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item .dl-btn {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .queue-item .state { font-size: 12px; color: #888; flex-shrink: 0; }
    .state.done { color: #2ecc71; }
    .state.loading { color: #f39c12; }
    .state.error { color: #e74c3c; }
    .divider { text-align: center; color: #444; font-size: 12px; margin: 24px 0; position: relative; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 44%; height: 1px; background: #2a2a3a;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎵 Suno DL</div>
  <div class="subtitle">Download Suno songs as MP3</div>

  <!-- Single download -->
  <label>Paste Suno URL or Song ID</label>
  <div class="input-row">
    <input type="text" id="urlInput" placeholder="https://suno.com/song/b1b5163c-..." />
    <button id="dlBtn" onclick="downloadSingle()">Download</button>
  </div>
  <div class="status" id="status"></div>

  <!-- Batch -->
  <div class="batch-area">
    <div class="divider">or batch download</div>
    <label>Paste multiple URLs (one per line)</label>
    <textarea id="batchInput" placeholder="https://suno.com/song/xxx&#10;https://suno.com/song/yyy&#10;..."></textarea>
    <button class="btn-batch" onclick="addBatch()">Add to Queue</button>
    <div class="queue" id="queue"></div>
  </div>
</div>

<script>
  function extractId(input) {
    input = input.trim();
    // Match UUID in URL or raw UUID
    const match = input.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    return match ? match[0] : null;
  }

  function mp3Url(id) {
    return `https://cdn1.suno.ai/${id}.mp3`;
  }

  function setStatus(msg, type = 'info') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  async function triggerDownload(id, filename) {
    const url = mp3Url(id);
    try {
      setStatus(`Downloading ${filename}...`, 'info');
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
      return true;
    } catch (e) {
      throw e;
    }
  }

  async function downloadSingle() {
    const input = document.getElementById('urlInput').value;
    const btn = document.getElementById('dlBtn');
    const id = extractId(input);
    if (!id) { setStatus('Invalid URL or ID', 'error'); return; }

    btn.disabled = true;
    setStatus('Preparing download...', 'info');
    try {
      await triggerDownload(id, `suno-${id}.mp3`);
      setStatus(`✓ Downloaded suno-${id}.mp3`, 'success');
    } catch(e) {
      setStatus(`Error: ${e.message}`, 'error');
    }
    btn.disabled = false;
  }

  function addBatch() {
    const lines = document.getElementById('batchInput').value.split('\n').filter(l => l.trim());
    const queue = document.getElementById('queue');
    lines.forEach(line => {
      const id = extractId(line);
      if (!id) return;
      // Skip duplicates
      if (document.getElementById('item-' + id)) return;

      const item = document.createElement('div');
      item.className = 'queue-item';
      item.id = 'item-' + id;
      item.innerHTML = `
        <div class="name" title="suno-${id}.mp3">suno-${id}.mp3</div>
        <span class="state" id="state-${id}">waiting</span>
        <button class="dl-btn" onclick="downloadItem('${id}')">⬇ DL</button>
      `;
      queue.appendChild(item);
    });

    if (lines.length > 0) {
      // Auto download all
      downloadAll();
    }
  }

  async function downloadItem(id) {
    const stateEl = document.getElementById('state-' + id);
    stateEl.textContent = 'downloading...';
    stateEl.className = 'state loading';
    try {
      await triggerDownload(id, `suno-${id}.mp3`);
      stateEl.textContent = '✓ done';
      stateEl.className = 'state done';
    } catch(e) {
      stateEl.textContent = '✗ error';
      stateEl.className = 'state error';
    }
  }

  async function downloadAll() {
    const items = document.querySelectorAll('.queue-item');
    for (const item of items) {
      const id = item.id.replace('item-', '');
      const stateEl = document.getElementById('state-' + id);
      if (stateEl.textContent === 'waiting') {
        await downloadItem(id);
        await new Promise(r => setTimeout(r, 500)); // small delay between downloads
      }
    }
  }
</script>
</body>
</html>
